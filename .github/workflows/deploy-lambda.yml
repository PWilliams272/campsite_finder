name: Deploy Lambda

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: lambda-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AWS CLI
        run: |
          pip install --upgrade awscli

      - name: Install dependencies not covered by the AWSSDKPandas layer
        run: |
          # The function relies on the AWS-managed AWSSDKPandas-Python311
          # layer for pandas/numpy/requests/boto3 — this only needs to add
          # what that layer doesn't already provide.
          pip install --target ./package itsdangerous

      - name: Zip Lambda function
        run: |
          cp -r campsite_finder ./package/
          cd package && zip -r ../function.zip . && cd ..

      - name: Deploy to AWS Lambda with retries
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-2
          LAMBDA_FUNCTION_NAME: campsite_finder
          CAMPSITE_FINDER_DOMAIN: ${{ secrets.CAMPSITE_FINDER_DOMAIN }}
        run: |
          for i in {1..5}; do
            set +e
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --zip-file fileb://function.zip \
              --publish
            STATUS=$?
            set -e
            if [ $STATUS -eq 0 ]; then
              echo "Deployment successful"
              exit 0
            else
              echo "Resource conflict or other error, retrying in 30 seconds... (Attempt $i/5)"
              sleep 30
            fi
          done
          echo "Failed to deploy after retries"
          exit 1