<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Campsite Finder{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('campsite_finder.static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('campsite_finder.static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="site-nav">
        <span class="wordmark">Campsite Finder</span>
        <nav>
            <a href="{{ url_for('campsite_finder.index') }}" class="{{ 'active' if not admin_page and not my_alerts_page else '' }}">New Alert</a>
            {% if current_user_id %}
            <a href="{{ url_for('campsite_finder.my_alerts') }}" class="{{ 'active' if my_alerts_page else '' }}">My Alerts</a>
            {% endif %}
            {% if viewer_is_admin %}
            <a href="{{ url_for('campsite_finder.admin') }}" class="{{ 'active' if admin_page else '' }}">Admin</a>
            {% endif %}
        </nav>
    </div>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
